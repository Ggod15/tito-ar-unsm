<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1d2a" />
  <title>Tito · Guía AR Sistemas UNSM</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="js/content.js"></script>
  <script src="js/mascot.js"></script>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>

  <a-scene id="scene" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
           renderer="alpha: true; antialias: true" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <a-entity camera="fov: 70" look-controls="touchEnabled: true; magicWindowTrackingEnabled: true" position="0 1.4 0"></a-entity>
    <a-entity light="type: ambient; intensity: 0.9; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 0.9; color: #fff4e0" position="1 3 2"></a-entity>
    <a-entity id="mascot" mascot position="0 0.45 -2.6" visible="false"></a-entity>
  </a-scene>

  <!-- Pantalla de inicio -->
  <section id="splash">
    <div class="card">
      <div class="logo">🐒</div>
      <h1>Conoce Sistemas con Tito</h1>
      <p class="sub">Ingeniería de Sistemas e Informática · UNSM</p>
      <p class="hint">Se usará la cámara y el sonido de tu celular para la experiencia de realidad aumentada.</p>
      <button id="btn-start" class="primary">Iniciar experiencia AR</button>
      <p id="splash-err" class="err" hidden></p>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" hidden>
    <header>
      <span class="badge">🐒 Tito · Guía AR</span>
      <button id="btn-mute" class="icon" aria-label="Silenciar voz">🔊</button>
    </header>

    <div id="subtitle" hidden></div>

    <nav id="menu" aria-label="Menú"></nav>

    <section id="panel" hidden>
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <button id="btn-close" class="icon" aria-label="Cerrar">✕</button>
      </div>
      <p id="panel-note" class="note" hidden></p>
      <div id="panel-body"></div>
      <button id="btn-replay" class="ghost">🔊 Escuchar de nuevo</button>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
